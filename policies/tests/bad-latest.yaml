# NON CONFORME : tag latest explicite (resources OK)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-latest
  namespace: tp-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: bad-latest }
  template:
    metadata:
      labels: { app: bad-latest }
    spec:
      containers:
        - name: web
          image: nginx:latest
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
