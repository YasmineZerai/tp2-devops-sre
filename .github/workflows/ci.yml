# Pipeline CI/CD - TP2 DevOps Avance
# Lint & Test -> SonarQube + Quality Gate -> Build -> Scan Trivy -> Push (GHCR) -> GitOps (branche deploy)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/yasminezerai/catalog-api

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation des dependances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Tests unitaires + couverture (seuil 85 %)
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Publication du rapport de couverture (Cobertura)
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  sonar:
    name: SonarQube Analysis & Quality Gate
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historique complet : necessaire pour le calcul du "new code"

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Analyse SonarQube Cloud + Quality Gate (bloquante)
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-scan-push:
    name: Build, Trivy Scan & Push
    needs: sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # uniquement ce job peut publier sur GHCR (moindre privilege)
    steps:
      - uses: actions/checkout@v7

      - name: Build de l'image (tag immuable = SHA du commit)
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" .

      # trivy-action epinglee par SHA de commit (release immuable v0.36.0) :
      # les tags de cette action ont ete detournes en mars 2026 (CVE-2026-33634).
      - name: Scan Trivy - rapport complet (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan Trivy - porte bloquante (echec si CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Connexion au registre GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push de l'image sur GHCR
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"

  deploy-gitops:
    name: GitOps - mise a jour de la branche deploy
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: write   # ecriture sur la branche deploy (non protegee) uniquement
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ecriture du nouveau tag d'image sur la branche deploy (source de verite d'ArgoCD)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git fetch origin deploy
            git checkout -B deploy origin/deploy
          else
            git checkout --orphan deploy
            git rm -rfq .
          fi
          rm -rf helm
          git checkout "$GITHUB_SHA" -- helm
          sed -i -E "s|^(  tag:).*|\1 \"$GITHUB_SHA\"|" helm/catalog-api/values.yaml
          grep -n "tag:" helm/catalog-api/values.yaml
          git add -A helm
          if git diff --cached --quiet; then
            echo "Aucun changement a deployer"
          else
            git commit -m "deploy: catalog-api ${GITHUB_SHA::7}"
            git push origin deploy
          fi
