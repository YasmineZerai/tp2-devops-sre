# Application ArgoCD : deploie le chart Helm depuis la branche "deploy" (mise a jour par la CI)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YasmineZerai/tp2-devops-sre.git
    targetRevision: deploy
    path: helm/catalog-api
  destination:
    server: https://kubernetes.default.svc
    namespace: tp-app
  syncPolicy:
    automated:
      prune: true      # supprime ce qui n'est plus dans Git
      selfHeal: true   # corrige toute derive manuelle du cluster
    syncOptions:
      - CreateNamespace=true   # cree le namespace tp-app s'il n'existe pas
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
