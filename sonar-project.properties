# SonarQube Cloud - analyse statique (SAST, bugs, code smells, duplication, couverture)
sonar.organization=yasminezerai
sonar.projectKey=YasmineZerai_tp2-devops-sre
sonar.projectName=tp2-devops-sre

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
# Rapport Cobertura genere par pytest-cov dans le job "Lint & Test"
sonar.python.coverage.reportPaths=coverage.xml

# Quality Gate BLOQUANTE : le scanner attend le verdict et echoue si la gate est rouge
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
