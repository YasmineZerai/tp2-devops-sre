# Recepteur d'alertes de secours (affiche dans ses logs chaque notification recue)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-receiver }
  template:
    metadata:
      labels: { app: alert-receiver }
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:39
          env:
            - { name: HTTP_PORT, value: "8080" }
            - { name: LOG_IGNORE_PATH, value: "/healthz" }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: monitoring
spec:
  selector: { app: alert-receiver }
  ports:
    - port: 8080
      targetPort: 8080
