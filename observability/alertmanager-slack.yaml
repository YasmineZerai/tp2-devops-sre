# Routage Alertmanager : Critical -> "Page" (canal d'astreinte), Warning -> Slack #alerts
# L'URL du webhook Slack est lue depuis un Secret Kubernetes monte (jamais dans Git).
alertmanager:
  alertmanagerSpec:
    secrets:
      - slack-webhook                       # monte dans /etc/alertmanager/secrets/slack-webhook/
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, severity]
      group_wait: 20s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - receiver: page-critical
          matchers: ['severity="critical"']
        - receiver: slack-warning
          matchers: ['severity="warning"']
    receivers:
      - name: "null"
      - name: page-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            send_resolved: true
            title: ':rotating_light: PAGE [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: '<!channel> {{ .CommonAnnotations.summary }} - {{ .CommonAnnotations.description }}'
      - name: slack-warning
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            send_resolved: true
            title: ':warning: [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: '{{ .CommonAnnotations.summary }} - {{ .CommonAnnotations.description }}'
