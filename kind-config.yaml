# Cluster Kind du TP2 : 1 noeud, NodePorts exposes sur localhost
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tp2
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # catalog-api      -> http://localhost:30080
        hostPort: 30080
      - containerPort: 30300   # Grafana          -> http://localhost:30300
        hostPort: 30300
      - containerPort: 30900   # Prometheus       -> http://localhost:30900
        hostPort: 30900
      - containerPort: 30903   # Alertmanager     -> http://localhost:30903
        hostPort: 30903
      - containerPort: 30443   # ArgoCD (HTTPS)   -> https://localhost:30443
        hostPort: 30443
